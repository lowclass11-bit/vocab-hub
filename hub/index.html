<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>어휘 수업 허브</title>
<style>
:root{
  --slate:#ffffff; --slate2:#f6f7f9; --line:#e2e5ea;
  --paper:#f0ece2; --paperdim:#6b7280;
  --lime:#5f8c0e; --cyan:#0e8a84; --amber:#b3720f;
  --ink:#1c2333; --dim:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(900px 500px at 15% -5%, #eef2f8 0%, transparent 60%),
    var(--slate);
  color:var(--ink);
  font-family:"Helvetica Neue",Arial,system-ui,sans-serif;
  min-height:100dvh; -webkit-font-smoothing:antialiased;
  padding:0 0 60px;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* header */
header{padding:40px 0 26px}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dim)}
h1{font-size:clamp(30px,7vw,52px);font-weight:800;letter-spacing:-.025em;line-height:1.02;margin:10px 0 0}
h1 .u{color:var(--lime)}
.sub{color:var(--dim);margin-top:12px;font-size:15px;line-height:1.6;max-width:560px}
.hint{margin-top:16px;display:inline-flex;align-items:center;gap:9px;font-size:13px;
  color:var(--paperdim);background:var(--slate2);border:1px solid var(--line);
  border-radius:30px;padding:8px 15px}
.hint b{color:var(--ink);font-weight:700}

/* group heading */
.group{margin-top:38px}
.group-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.group-head h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.group-head .tag{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.12em;
  color:var(--dim)}
.group-head .cnt{margin-left:auto;font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}

/* cards */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--slate2);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;display:flex;flex-direction:column;transition:transform .14s,border-color .2s,box-shadow .2s;
  box-shadow:0 1px 3px rgba(20,30,50,.04)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,30,50,.09)}
.card.lime:hover{border-color:var(--lime)}
.card.cyan:hover{border-color:var(--cyan)}
.card.amber:hover{border-color:var(--amber)}
.card-top{padding:18px 18px 14px;display:flex;gap:14px}
.qr{width:96px;height:96px;flex-shrink:0;background:#fff;border-radius:9px;padding:6px;
  display:flex;align-items:center;justify-content:center}
.qr canvas{width:100%;height:100%;image-rendering:pixelated}
.qr.empty{background:var(--slate);border:1px dashed var(--line);
  color:var(--dim);font-size:11px;text-align:center;line-height:1.4;padding:10px}
.card.is-locked{opacity:.62}
.card.is-locked .qr.empty{font-size:34px;align-items:center;justify-content:center;
  border-style:solid;background:var(--slate2)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.badge{align-self:flex-start;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.13em;padding:3px 8px;border-radius:5px;text-transform:uppercase;font-weight:700}
.badge.lime{background:rgba(95,140,14,.12);color:var(--lime)}
.badge.cyan{background:rgba(14,138,132,.12);color:var(--cyan)}
.badge.amber{background:rgba(179,114,15,.12);color:var(--amber)}
.card h3{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:9px 0 3px;line-height:1.15}
.card .desc{color:var(--dim);font-size:13px;line-height:1.5}
.status{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:7px;
  font-family:ui-monospace,monospace;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.live{background:var(--lime)}
.dot.wait{background:var(--dim)}
.status .live-t{color:var(--paperdim)}
.status .wait-t{color:var(--dim)}
.card-actions{display:flex;border-top:1px solid var(--line)}
.card-actions button, .card-actions a{
  flex:1;padding:13px;background:transparent;border:none;color:var(--ink);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:center;
  text-decoration:none;transition:background .15s}
.card-actions button:hover, .card-actions a:hover{background:rgba(0,0,0,.04)}
.card-actions .divider{flex:0 0 1px;background:var(--line)}
.card-actions .disabled{color:var(--dim);cursor:default;pointer-events:none}
.card-actions .go{color:var(--ink)}

/* QR modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(12,16,26,.9);
  display:none;align-items:center;justify-content:center;padding:24px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.modal-inner{background:var(--paper);color:var(--slate);border-radius:20px;
  padding:26px;max-width:360px;width:100%;text-align:center}
.modal-inner h3{font-size:20px;font-weight:800;margin-bottom:4px}
.modal-inner .m-sub{color:#6b6455;font-size:13px;margin-bottom:18px}
.modal-qr{width:230px;height:230px;margin:0 auto;background:#fff;border-radius:12px;
  padding:12px;box-shadow:0 6px 24px rgba(0,0,0,.15)}
.modal-qr canvas{width:100%;height:100%;image-rendering:pixelated}
.m-url{font-family:ui-monospace,monospace;font-size:12px;color:#6b6455;margin:16px 0 4px;
  word-break:break-all;background:#e5e0d4;border-radius:8px;padding:9px 12px}
.m-close{margin-top:16px;background:var(--slate);color:var(--paper);border:none;
  border-radius:11px;padding:12px 22px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.m-tip{margin-top:12px;font-size:12px;color:#8a8371;line-height:1.5}

footer{margin-top:48px;text-align:center;color:var(--dim);font-size:12px;line-height:1.7}
footer .mono{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Vocabulary · Teaching Hub</div>
    <h1>어휘 수업 <span class="u">허브</span></h1>
    <p class="sub">수업에 쓰는 단어 게임을 한 곳에서. 카드를 누르면 바로 열리고, QR 버튼을 누르면 교실 화면에 띄워 학생들이 스캔합니다.</p>
    <div class="hint">📱 <span><b>교실에서</b> — QR을 화면에 띄우거나 빔프로젝터로 쏘면 학생 폰으로 바로 접속</span></div>
  </header>

  <div id="groups"></div>

  <footer>
    새 게임을 만들면 이 목록에 추가하세요. 주소만 바꾸면 QR은 자동으로 갱신됩니다.<br>
    <span class="mono">made for classroom use · QR은 브라우저에서 생성 (인터넷 없이도 표시)</span>
  </footer>
</div>

<!-- QR modal -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <h3 id="m-title">—</h3>
    <div class="m-sub" id="m-desc"></div>
    <div class="modal-qr"><canvas id="m-canvas"></canvas></div>
    <div class="m-url" id="m-url"></div>
    <button class="m-close" id="m-close">닫기</button>
    <div class="m-tip">학생들에게 이 화면을 보여주고 카메라로 QR을 비추게 하세요.</div>
  </div>
</div>

<script>
/* =========================================================
   자료 목록 — 새 항목은 여기에 추가.
   url이 빈 문자열("")이면 "준비 중"으로 표시되고 QR은 안 나옵니다.
   ========================================================= */
const GROUPS = [
  {

    items:[
      {name:"2학기 단어 게임",
       desc:"2학기 교과서 단어 53개. 낚시·단어 고르기·의미 사수·카드 뒤집기 4게임.",

    ]
  },

    items:[
      {name:"모의고사 단어 게임",
       desc:"소각장·다리 놓기·지뢰밭 3게임. 5개 단원 선택. 클릭 후 게임을 고르세요.",
       url:"https://lowclass11-bit.github.io/vocab-hub/mock/"},
    ]

    items:[
      {name:"어휘 실험실 · 10종",
       desc:"준비 중입니다. 곧 열려요.",
       url:"https://lowclass11-bit.github.io/vocab-hub/lab/", locked:true},
    ]
  },

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;

    ctx.fillStyle='#fff';ctx.fillRect(0,0,dim,dim);
    ctx.fillStyle='#12161a';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(c+q,r+q,1,1);
  }
};

/* =========================================================
   렌더
   ========================================================= */
const groupsEl=document.getElementById('groups');
GROUPS.forEach(g=>{
  const sec=document.createElement('div');sec.className='group';
  const live=g.items.filter(i=>i.url).length;
  sec.innerHTML=`<div class="group-head">
     <h2>${g.title}</h2><span class="tag">${g.tag}</span>
     <span class="cnt">${live}/${g.items.length} 게시됨</span></div>`;
  const cards=document.createElement('div');cards.className='cards';
  g.items.forEach(it=>{
    const card=document.createElement('div');card.className='card '+g.accent;
    const locked=!!it.locked;
    const hasUrl=!!it.url && !locked;
    if(locked) card.classList.add('is-locked');
    card.innerHTML=`
      <div class="card-top">
        <div class="qr ${hasUrl?'':'empty'}">${hasUrl?'<canvas></canvas>':(locked?'🔒':'주소 등록<br>전')}</div>
        <div class="meta">
          <span class="badge ${g.accent}">${g.tag}</span>
          <h3>${it.name}</h3>
          <div class="desc">${it.desc}</div>
          <div class="status">
            <span class="dot ${hasUrl?'live':'wait'}"></span>
            <span class="${hasUrl?'live-t':'wait-t'}">${locked?'🔒 잠김 — 준비 중':(hasUrl?'게시됨':'준비 중 — 주소 등록 후 활성화')}</span>
          </div>
        </div>
      </div>
      <div class="card-actions">
        ${hasUrl
          ? `<a class="go" href="${it.url}" target="_blank" rel="noopener">열기 ↗</a>
             <div class="divider"></div>
             <button class="qrbtn">QR 띄우기</button>`
          : (locked
             ? `<span class="disabled">🔒 준비 중</span>`
             : `<span class="disabled">열기</span><div class="divider"></div><span class="disabled">QR</span>`)}
      </div>`;
    cards.appendChild(card);
    if(hasUrl){
      const cv=card.querySelector('.qr canvas');
      try{QR.draw(cv,it.url);}catch(e){cv.parentElement.textContent='QR 오류';}
      card.querySelector('.qrbtn').onclick=()=>openModal(it);
    }
  });
  sec.appendChild(cards);groupsEl.appendChild(sec);
});

/* modal */
const modal=document.getElementById('modal');
function openModal(it){
  document.getElementById('m-title').textContent=it.name;
  document.getElementById('m-desc').textContent=it.desc;
  document.getElementById('m-url').textContent=it.url;
  try{QR.draw(document.getElementById('m-canvas'),it.url);}catch(e){}
  modal.classList.add('on');
}
document.getElementById('m-close').onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('on');});
</script>
</body>
