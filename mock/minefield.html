<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>지뢰밭 건너기</title>
<style>
:root{
  --night:#0c1116; --field:#131b22; --field2:#1b2630; --grid:#26343f;
  --snow:#eaf1f5; --dim:#7f909e;
  --safe:#57d9a3; --mine:#ff5464; --spark:#ffd166; --path:#4db1ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--snow);
  font-family:"Trebuchet MS",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
#app{height:100dvh;display:flex;flex-direction:column;position:relative}

.top{display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:linear-gradient(#0e161d,#0a1015);border-bottom:1px solid #000}
.brand{font-weight:800;font-size:16px;letter-spacing:.02em}
.brand b{color:var(--mine)}
.brand small{display:block;font-size:8px;letter-spacing:.3em;color:var(--dim);
  font-family:ui-monospace,monospace;text-transform:uppercase}
.lives{margin-left:auto;font-size:17px;letter-spacing:2px}
.rowscore{font-family:ui-monospace,monospace;font-size:13px;color:var(--dim);margin-left:12px}
.rowscore b{color:var(--snow)}

.goal{padding:12px 16px;text-align:center;background:var(--field);border-bottom:1px solid var(--grid)}
.goal .lbl{font-size:11px;letter-spacing:.24em;color:var(--dim);
  font-family:ui-monospace,monospace;text-transform:uppercase}
.goal .mean{font-size:clamp(24px,6.5vw,34px);font-weight:800;color:var(--spark);margin-top:2px;
  text-shadow:0 0 16px rgba(255,209,102,.35)}

.stage{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;padding:14px;
  display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(90% 40% at 50% 0%,rgba(77,177,255,.06),transparent 55%)}
.field{display:grid;gap:5px;width:100%;max-width:560px;padding-bottom:40px}
.tile{aspect-ratio:1.05;border-radius:8px;border:1px solid var(--grid);
  background:linear-gradient(160deg,var(--field2),var(--field));
  display:flex;align-items:center;justify-content:center;padding:2px;text-align:center;
  font-weight:700;font-size:13px;color:var(--snow);cursor:pointer;font-family:inherit;
  transition:transform .06s,border-color .15s,background .15s;position:relative;overflow:hidden}
.tile:active{transform:scale(.95)}
.tile.locked{opacity:.32;pointer-events:none}
.tile.safe{border-color:var(--safe);background:rgba(87,217,163,.18);color:var(--safe);
  box-shadow:0 0 12px rgba(87,217,163,.3)}
.tile.boom{border-color:var(--mine);background:rgba(255,84,100,.22);color:var(--mine);
  animation:boom .4s}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.tile.cleared{opacity:.5;border-color:var(--safe)}
.tile .row-done{position:absolute;inset:0;border-radius:9px;pointer-events:none}

/* 지뢰 그래픽 (밟기 전엔 숨김) */
.mine-ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .12s;pointer-events:none}
.tile.revealed .en-text{opacity:0}
.tile.revealed .mine-ico{opacity:1}
.mine-body{position:relative;width:52%;height:52%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#5b6470,#20262e 70%,#0d1015);
  box-shadow:inset -2px -3px 4px rgba(0,0,0,.6),inset 2px 2px 3px rgba(255,255,255,.15),
    0 1px 3px rgba(0,0,0,.5)}
/* 뿔(스파이크) 8방향 */
.mine-body::before,.mine-body::after,
.mine-spikes::before,.mine-spikes::after{content:"";position:absolute;left:50%;top:50%;
  width:16%;height:132%;background:linear-gradient(#4a525c,#242a31);border-radius:2px;
  transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.mine-body::before{--rot:0deg}
.mine-body::after{--rot:90deg}
.mine-spikes{position:absolute;inset:0}
.mine-spikes::before{--rot:45deg}
.mine-spikes::after{--rot:-45deg}
/* 상단 점화구 */
.mine-cap{position:absolute;top:6%;left:50%;transform:translateX(-50%);
  width:22%;height:14%;background:#d9a441;border-radius:2px;z-index:2}

.en-text{position:relative;z-index:1;transition:opacity .1s}

/* 폭발 플래시 */
.blast{position:absolute;border-radius:50%;pointer-events:none;z-index:8;
  background:radial-gradient(circle,#fff 0%,#ffd166 25%,#ff7a1f 50%,rgba(255,60,20,0) 72%);
  animation:blast .5s ease-out forwards}
@keyframes blast{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.shard{position:absolute;width:5px;height:5px;border-radius:1px;background:#ffb03a;
  pointer-events:none;z-index:8}

/* 화면 흔들림 */
@keyframes shake{10%,90%{transform:translate(-2px,1px)}30%,70%{transform:translate(4px,-2px)}
  50%{transform:translate(-5px,2px)}}
.shaking{animation:shake .4s}

.rowmark{position:absolute;left:6px;font-family:ui-monospace,monospace;font-size:10px;color:var(--dim)}

.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:28px;text-align:center;
  background:radial-gradient(circle at 50% 40%,rgba(20,40,55,.6),rgba(8,12,16,.97))}
.screen.hide{display:none}
.screen h1{font-size:clamp(28px,8vw,48px);font-weight:800;line-height:1.05}
.screen h1 span{color:var(--mine)}
.screen h1 em{color:var(--safe);font-style:normal}
.screen p{color:var(--dim);max-width:410px;font-size:15px;line-height:1.7}
.screen .big{font-family:ui-monospace,monospace;font-size:54px;font-weight:800;color:var(--spark)}
.btn{cursor:pointer;border:none;border-radius:9px;padding:15px 30px;font-family:inherit;
  font-weight:800;font-size:17px;color:#0c1116;background:linear-gradient(var(--path),#2f8fe0);
  box-shadow:0 4px 0 #1e6bb0;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e6bb0}
.progress{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim)}

  /* 단원 선택 */
  .topicsel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;
    background:rgba(8,10,14,.94);overflow-y:auto}
  .topicsel.hide{display:none}
  .topicsel h2{font-size:22px;font-weight:800;color:#fff}
  .topicsel p{color:#8b93a6;font-size:14px;max-width:360px;line-height:1.6}
  .topicsel .tgrid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
  .tbtn{padding:15px 18px;border-radius:12px;border:1px solid #2c3a4e;
    background:#161c26;color:#eaf1f5;font-family:inherit;font-weight:700;font-size:17px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    transition:transform .12s,border-color .15s}
  .tbtn:hover{transform:translateY(-2px);border-color:#57d9a3}
  .tbtn .cnt{font-family:ui-monospace,monospace;font-size:12px;color:#8b93a6;font-weight:400}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">지뢰밭 <b>건너기</b><small>Meaning Minefield</small></div>
    <div class="lives" id="lives">❤️❤️❤️</div>
    <div class="rowscore">줄 <b id="row">0</b>/<span id="rows">0</span></div>
  </div>

  <div class="goal">
    <div class="lbl">이 뜻의 단어만 밟아라</div>
    <div class="mean" id="mean">—</div>
  </div>

  <div class="stage" id="stage">
    <div class="field" id="field"></div>


    <!-- 단원 선택 -->
    <div class="topicsel" id="topicsel">
      <h2>단원 선택</h2>
      <p>어떤 단원으로 연습할까요?</p>
      <div class="tgrid" id="tgrid"></div>
    </div>

    <!-- START -->
    <div class="screen" id="start">
      <h1>지뢰밭 <span>건너기</span></h1>
      <p>발밑에 영어 단어가 깔려 있습니다. 위에 뜬 <em>뜻과 맞는 단어</em>만 밟고 한 줄씩 건너세요. 뜻이 안 맞는 칸은 지뢰 — 밟으면 하트가 터집니다. 줄마다 뜻이 바뀌어요.</p>
      <button class="btn" id="go">첫 발 내딛기</button>
    </div>

    <!-- OVER / WIN -->
    <div class="screen hide" id="over">
      <h1 id="over-t">건넜다!</h1>
      <div class="big" id="final">0</div>
      <div class="progress" id="over-sub"></div>
      <button class="btn" id="again">다시 도전</button>
    </div>
  </div>
</div>

/* ===== 공통 학습 기록 (이 폰에만 저장) ===== */
const VOCAB_STORE = (function(){
  const WRONG_KEY = 'vocab_wrong_v1';   // 오답노트
  const STAT_KEY  = 'vocab_stats_v1';   // 게임별 최고기록
  function load(k){ try{return JSON.parse(localStorage.getItem(k))||{};}catch(e){return {};} }
  function save(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
  return {
    // 틀린 단어 기록: unit 단원, w={en,ko}
    addWrong(unit, w){
      if(!w||!w.en) return;
      const d=load(WRONG_KEY);
      const key=unit+'|'+w.en;
      if(!d[key]) d[key]={en:w.en, ko:w.ko, unit:unit, count:0};
      d[key].count++;
      d[key].last=Date.now();
      save(WRONG_KEY,d);
    },
    // 맞히면 오답노트에서 서서히 제거 (2번 연속 맞히면 지움)
    markRight(unit, w){
      if(!w||!w.en) return;
      const d=load(WRONG_KEY);
      const key=unit+'|'+w.en;
      if(d[key]){ d[key].count-=1; if(d[key].count<=0) delete d[key]; save(WRONG_KEY,d); }
    },
    getWrong(){ return Object.values(load(WRONG_KEY)); },
    clearWrong(){ save(WRONG_KEY,{}); },
    // 최고기록: game 게임명, unit, level, value(점수/시간), higher=true면 큰게좋음
    saveBest(game, unit, level, value, higher){
      const d=load(STAT_KEY);
      const key=game+'|'+unit+'|'+level;
      const cur=d[key];
      const better = cur==null || (higher ? value>cur : value<cur);
      if(better){ d[key]=value; save(STAT_KEY,d); return true; }
      return false;
    },
    getBest(game, unit, level){
      const d=load(STAT_KEY);
      return d[game+'|'+unit+'|'+level];
    },
    setLastUnit(u){ save('vocab_last_unit',{u}); },
    getLastUnit(){ return (load('vocab_last_unit')||{}).u; },
  };
})();

let WORDS = MOCK_TOPICS[0].words;
let curUnit = MOCK_TOPICS[0].name;

const $=s=>document.querySelector(s);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pick=(arr,n,not)=>shuffle(arr.filter(w=>w!==not)).slice(0,n);

const ROWS=15, COLS=5;
let lives=3, curRow=0, score=0, target=null, rowsData=[];

function buildRows(){
  rowsData=[];
  for(let r=0;r<ROWS;r++){
    const t=shuffle(WORDS)[0];
    // 한 줄: 정답 1~2개 + 오답으로 COLS 채우기
    const safeCount=1+(Math.random()<0.35?1:0);
    const cells=[];
    for(let i=0;i<safeCount;i++) cells.push({w:t,safe:true});
    pick(WORDS,COLS-safeCount,t).forEach(w=>cells.push({w,safe:false}));
    rowsData.push({target:t,cells:shuffle(cells)});
  }
}

function render(){
  const f=$('#field');f.innerHTML='';
  f.style.gridTemplateColumns='repeat('+COLS+',1fr)';
  // 아래에서 위로 오르는 느낌: 배열을 역순으로 그려 마지막 줄(목표)이 위로
  for(let r=ROWS-1;r>=0;r--){
    const row=rowsData[r];
    row.cells.forEach((cell)=>{
      const el=document.createElement('button');
      el.className='tile';
      el.innerHTML='<span class="en-text">'+cell.w.en+'</span>'+
        '<span class="mine-ico"><span class="mine-body"><span class="mine-spikes"></span>'+
        '<span class="mine-cap"></span></span></span>';
      if(r<curRow) el.classList.add('cleared','locked');
      else if(r>curRow) el.classList.add('locked');
      if(r===curRow) el.dataset.active='1';
      if(cell.w.en.length>8) el.querySelector('.en-text').style.fontSize='12px';
      el.onclick=()=>step(r,cell,el);
      f.appendChild(el);
    });
  }
  const cur=rowsData[curRow];
  if(cur){target=cur.target;$('#mean').textContent=target.ko;}
  $('#row').textContent=curRow;$('#rows').textContent=ROWS;
  // 현재 줄을 화면 중앙으로 스크롤
  requestAnimationFrame(()=>{
    const act=f.querySelector('[data-active]');
    if(act) act.scrollIntoView({block:'center',behavior:'smooth'});
  });
}

function step(r,cell,el){
  if(r!==curRow)return;
  if(cell.safe){
    el.classList.add('safe');score+=10;$('#lives');
    VOCAB_STORE.markRight(curUnit, target);
    // 이 줄 통과 → 다음 줄
    setTimeout(()=>{
      curRow++;
      if(curRow>=ROWS){win();return;}
      render();
    },260);
  }else{
    el.classList.add('boom','revealed');
    VOCAB_STORE.addWrong(curUnit, target);
    explode(el);
    lives--;setLives();
    setTimeout(()=>el.classList.remove('boom'),400);
    if(lives<=0){ setTimeout(lose,500); }
  }
}

function explode(el){
  const stage=$('#stage');
  const sr=stage.getBoundingClientRect();
  const r=el.getBoundingClientRect();
  const cx=r.left-sr.left+r.width/2;
  const cy=r.top-sr.top+r.height/2;
  // 섬광
  const blast=document.createElement('div');blast.className='blast';
  const sz=r.width*2.4;
  blast.style.width=sz+'px';blast.style.height=sz+'px';
  blast.style.left=cx+'px';blast.style.top=cy+'px';
  stage.appendChild(blast);
  setTimeout(()=>blast.remove(),500);
  // 파편
  for(let i=0;i<14;i++){
    const s=document.createElement('div');s.className='shard';
    s.style.left=cx+'px';s.style.top=cy+'px';
    const ang=Math.random()*Math.PI*2, dist=30+Math.random()*70;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    s.style.background=Math.random()<0.5?'#ffb03a':'#ff6b1f';
    stage.appendChild(s);
    s.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}
    ],{duration:450+Math.random()*200,easing:'cubic-bezier(.2,.6,.3,1)'});
    setTimeout(()=>s.remove(),700);
  }
  // 화면 흔들림
  const app=$('#app'); app.classList.remove('shaking');void app.offsetWidth;
  app.classList.add('shaking');
  setTimeout(()=>app.classList.remove('shaking'),400);
}

function setLives(){$('#lives').textContent='❤️'.repeat(lives)||'💥';}

function win(){
  $('#over-t').innerHTML='건넜다! 🎉';
  $('#final').textContent=score;
  $('#over-sub').textContent=ROWS+'줄 완주 · 남은 하트 '+lives;
  $('#over').classList.remove('hide');
}
function lose(){
  // 현재 줄의 남은 지뢰를 모두 드러냄
  const active=[...document.querySelectorAll('.tile[data-active]')];
  active.forEach(el=>{
    const txt=el.querySelector('.en-text').textContent;
    const isSafe = target && txt===target.en;
    if(!isSafe && !el.classList.contains('revealed')) el.classList.add('revealed');
  });
  $('#over-t').innerHTML='지뢰 폭발 💥';
  $('#final').textContent=score;
  $('#over-sub').textContent=curRow+'/'+ROWS+'줄에서 멈춤';
  setTimeout(()=>$('#over').classList.remove('hide'),450);
}

function start(){
  lives=3;curRow=0;score=0;setLives();
  buildRows();render();
  $('#start').classList.add('hide');$('#over').classList.add('hide');
}
$('#go').onclick=start;
$('#again').onclick=start;

/* ===== 단원 선택 ===== */
function renderTopics(){
  const g=document.getElementById('tgrid');g.innerHTML='';
  MOCK_TOPICS.forEach((t,i)=>{
    const b=document.createElement('button');b.className='tbtn';
    b.innerHTML='<span>'+t.name+'</span><span class="cnt">'+t.words.length+'단어</span>';
    b.onclick=()=>{ WORDS=t.words; curUnit=t.name; VOCAB_STORE.setLastUnit(t.name); document.getElementById('topicsel').classList.add('hide'); start(); };
    g.appendChild(b);
  });
}
function showTopics(){
  document.getElementById('topicsel').classList.remove('hide');
  document.getElementById('start').classList.add('hide');
  var ov=document.getElementById('over'); if(ov) ov.classList.add('hide');
  renderTopics();
}
// 시작/다시 버튼을 단원 선택으로 라우팅
(function(){
  var go=document.getElementById('go');
  if(go) go.onclick=showTopics;
  var ag=document.getElementById('again');
  if(ag) ag.onclick=showTopics;
})();
// 페이지 로드 시 단원 선택 버튼 즉시 표시
renderTopics();
document.getElementById('topicsel').classList.remove('hide');

</script>
