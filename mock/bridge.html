<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>단어 다리 놓기</title>
<style>
:root{
  --sky:#0d1220; --sky2:#141d31; --chasm:#070a12; --wood:#c9863f; --wood2:#a86a2b;
  --ink:#eaf1ff; --dim:#8395b4; --go:#7ee0b0; --no:#ff6b81; --gold:#ffcf5c; --plank:#d69a52;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);
  font-family:"Trebuchet MS",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
#app{height:100dvh;display:flex;flex-direction:column;position:relative}

.top{display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:linear-gradient(#101828,#0b1120);border-bottom:1px solid #000;z-index:5}
.brand{font-weight:800;font-size:16px}
.brand b{color:var(--wood)}
.brand small{display:block;font-size:8px;letter-spacing:.3em;color:var(--dim);
  font-family:ui-monospace,monospace;text-transform:uppercase}
.dist{margin-left:auto;text-align:right}
.dist .n{font-family:ui-monospace,monospace;font-size:22px;font-weight:800;color:var(--gold);line-height:1}
.dist .l{font-size:9px;letter-spacing:.2em;color:var(--dim);font-family:ui-monospace,monospace}

/* timer bar that drains — the plank you're standing on */
.plankbar{height:9px;background:var(--chasm);position:relative;overflow:hidden}
.plankbar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;
  background:linear-gradient(90deg,var(--no),var(--gold) 40%,var(--go));
  transition:width .08s linear}

.scene{flex:1;position:relative;overflow:hidden;
  background:
    linear-gradient(#16203a 0%,#0f1526 40%,var(--chasm) 100%)}
/* distant clouds / depth */
.scene::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 30% at 20% 15%,rgba(120,150,220,.10),transparent 60%),
             radial-gradient(50% 25% at 80% 25%,rgba(120,150,220,.08),transparent 60%)}

/* the bridge builds along the bottom third */
.bridge{position:absolute;left:0;right:0;bottom:70px;height:26px;display:flex;
  align-items:center;padding-left:12px;overflow:hidden;z-index:2}
.plank{width:30px;height:22px;margin-right:4px;border-radius:3px;flex-shrink:0;
  background:linear-gradient(var(--plank),var(--wood2));border:1px solid #7c4f1e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.plank.new{animation:drop .25s ease-out}
@keyframes drop{0%{transform:translateY(-40px) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
/* walker */
.walker{position:absolute;bottom:96px;font-size:26px;z-index:3;transition:left .25s;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transform:scaleX(-1)}

/* meaning + word choices */
.play{position:absolute;left:0;right:0;top:18px;display:flex;flex-direction:column;
  align-items:center;gap:14px;padding:0 16px;z-index:4}
.goal{text-align:center}
.goal .lbl{font-size:10px;letter-spacing:.26em;color:var(--dim);
  font-family:ui-monospace,monospace;text-transform:uppercase}
.goal .mean{font-size:clamp(26px,7vw,38px);font-weight:800;color:var(--gold);
  text-shadow:0 0 16px rgba(255,207,92,.35)}
.words{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:480px}
.wtile{padding:13px 17px;border-radius:10px;background:var(--sky2);
  border:1px solid #2b3958;color:var(--ink);font-family:inherit;font-weight:700;font-size:17px;
  cursor:pointer;transition:transform .06s,border-color .12s}
.wtile:active{transform:scale(.95)}
.wtile.good{border-color:var(--go);background:rgba(126,224,176,.16);color:var(--go)}
.wtile.bad{border-color:var(--no);background:rgba(255,107,129,.16);color:var(--no)}

.combo{position:absolute;top:120px;left:50%;transform:translateX(-50%);
  font-family:ui-monospace,monospace;font-weight:800;font-size:26px;color:var(--gold);
  opacity:0;pointer-events:none;z-index:6;text-shadow:0 2px 10px rgba(0,0,0,.6)}

.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:28px;text-align:center;
  background:radial-gradient(circle at 50% 40%,rgba(30,45,75,.6),rgba(7,10,18,.97))}
.screen.hide{display:none}
.screen h1{font-size:clamp(28px,8vw,48px);font-weight:800;line-height:1.05}
.screen h1 span{color:var(--wood)}
.screen p{color:var(--dim);max-width:410px;font-size:15px;line-height:1.7}
.screen .big{font-family:ui-monospace,monospace;font-size:56px;font-weight:800;color:var(--gold)}
.btn{cursor:pointer;border:none;border-radius:9px;padding:15px 30px;font-family:inherit;
  font-weight:800;font-size:17px;color:#0d1220;background:linear-gradient(var(--gold),#e0a838);
  box-shadow:0 4px 0 #b07d1e;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b07d1e}
.sub{font-family:ui-monospace,monospace;font-size:13px;color:var(--dim)}

  /* 단원 선택 */
  .topicsel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;
    background:rgba(8,10,14,.94);overflow-y:auto}
  .topicsel.hide{display:none}
  .topicsel h2{font-size:22px;font-weight:800;color:#fff}
  .topicsel p{color:#8b93a6;font-size:14px;max-width:360px;line-height:1.6}
  .topicsel .tgrid{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
  .tbtn{padding:15px 18px;border-radius:12px;border:1px solid #2c3a4e;
    background:#161c26;color:#eaf1f5;font-family:inherit;font-weight:700;font-size:17px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    transition:transform .12s,border-color .15s}
  .tbtn:hover{transform:translateY(-2px);border-color:#ffcf5c}
  .tbtn .cnt{font-family:ui-monospace,monospace;font-size:12px;color:#8b93a6;font-weight:400}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">단어 다리 놓기<small>Word Bridge</small></div>
    <div class="dist"><div class="n" id="dist">0</div><div class="l">STEPS</div></div>
  </div>
  <div class="plankbar"><div class="fill" id="timer"></div></div>

  <div class="scene" id="scene">
    <div class="play">
      <div class="goal"><div class="lbl">이 뜻의 단어를 밟아 다리를 이어라</div><div class="mean" id="mean">—</div></div>
      <div class="words" id="words"></div>
    </div>
    <div class="combo" id="combo"></div>
    <div class="bridge" id="bridge"></div>
    <div class="walker" id="walker" style="left:12px">🚶</div>


    <!-- 단원 선택 -->
    <div class="topicsel" id="topicsel">
      <h2>단원 선택</h2>
      <p>어떤 단원으로 연습할까요?</p>
      <div class="tgrid" id="tgrid"></div>
    </div>

    <!-- START -->
    <div class="screen" id="start">
      <h1>단어 <span>다리 놓기</span></h1>
      <p>발밑 널빤지가 계속 삭아 무너집니다. 위에 뜬 뜻에 맞는 단어를 <b>빠르게 연속으로</b> 밟아 다리를 이어가세요. 멈추면 시간이 다 되어 추락합니다. 얼마나 멀리 갈 수 있나요?</p>
      <button class="btn" id="go">첫 걸음</button>
    </div>

    <!-- OVER -->
    <div class="screen hide" id="over">
      <h1>추락! 🕳️</h1>
      <div class="big" id="final">0</div>
      <div class="sub" id="over-sub"></div>
      <button class="btn" id="again">다시 건너기</button>
    </div>
  </div>
</div>

    {en:"exchange",ko:"교환(하다)"},{en:"goods",ko:"재화; 상품"},{en:"service",ko:"용역"},
    {en:"enable",ko:"가능하게 하다"},{en:"labor",ko:"노동; 노동하다"},{en:"supply",ko:"공급(하다)"},
    {en:"demand",ko:"수요; 요구하다"},{en:"industry",ko:"산업; 근면"},{en:"recent",ko:"최근의"},
    {en:"survey",ko:"조사하다; 개관하다"},{en:"gap",ko:"격차"},{en:"import",ko:"수입(하다)"},
    {en:"export",ko:"수출(하다)"},{en:"produce",ko:"생산하다"},{en:"transaction",ko:"거래; 처리"},
    {en:"retail",ko:"소매의; 소매하다"},{en:"commerce",ko:"상업, 무역"},{en:"balance",ko:"균형; 수지"},
    {en:"customer",ko:"고객, 손님"},{en:"consumer",ko:"소비자"},{en:"wholesaler",ko:"도매상인"},
    {en:"distributor",ko:"유통업자; 분배자"},{en:"retailer",ko:"소매상인"},{en:"purchase",ko:"구입(하다)"},
    {en:"item",ko:"물품"},{en:"refund",ko:"환불(하다)"},{en:"receipt",ko:"영수증; 수령"},
    {en:"objective",ko:"목적; 객관적인"},{en:"vital",ko:"중대한; 생명의"},{en:"whether A or B",ko:"A이든 B이든"},
    {en:"shift",ko:"이동하다; 바꾸다"},{en:"favor",ko:"이익; 호의; 부탁"},{en:"realization",ko:"인식; 실현"},
    {en:"relationship",ko:"관계, 관련"},
    {en:"employment",ko:"고용"},{en:"contract",ko:"계약(하다)"},{en:"incentive",ko:"포상금; 장려하는"},
    {en:"compensation",ko:"보상"},{en:"expire",ko:"만기가 되다"},{en:"valid",ko:"유효한; 타당한"},
    {en:"business",ko:"사업; 장사"},{en:"competition",ko:"경쟁"},{en:"control",ko:"지배하다, 통제하다"},
    {en:"develop",ko:"개발하다; 발전시키다"},{en:"a price break",ko:"가격 인하"},{en:"order",ko:"주문하다; 명령하다"},
    {en:"quantity",ko:"양, 수량"},{en:"cost",ko:"비용; 비용이 들다"},{en:"store",ko:"저장하다; 가게"},
    {en:"ship",ko:"수송하다; 배"},{en:"bill",ko:"청구하다; 청구서"},{en:"company",ko:"회사; 동행"},
    {en:"possess",ko:"소유하다"},{en:"manufacture",ko:"제조(하다)"},{en:"advertise",ko:"광고하다"},
    {en:"promote",ko:"촉진하다; 승진시키다"},{en:"currently",ko:"현재는, 지금은"},{en:"ensure",ko:"보증하다"},
    {en:"exclusive",ko:"독점적인; 배타적인"},
  ]},
];
let WORDS = MOCK_TOPICS[0].words;

const $=s=>document.querySelector(s);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pick=(arr,n,not)=>shuffle(arr.filter(w=>w!==not)).slice(0,n);

let target=null, steps=0, combo=0, running=false;
let timeLeft=1, timeMax=1, last=0, raf=null;

function newRound(){
  target=shuffle(WORDS)[0];
  $('#mean').textContent=target.ko;
  const opts=shuffle([target,...pick(WORDS,3,target)]);
  const box=$('#words');box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='wtile';b.textContent=o.en;
    b.onclick=()=>tap(o,b);
    box.appendChild(b);
  });
  // 걸음마다 제한시간이 조금씩 짧아짐 (긴장 상승)
  timeMax=Math.max(2.2, 4.0 - steps*0.04);
  timeLeft=timeMax;
}

function tap(o,btn){
  if(!running)return;
  if(o===target){
    btn.classList.add('good');
    steps++; combo++;
    $('#dist').textContent=steps;
    addPlank(); moveWalker();
    if(combo>1 && combo%3===0) popCombo(combo+' 연속!');
    setTimeout(newRound,120);
  }else{
    btn.classList.add('bad');
    // 오답은 시간 크게 깎음
    timeLeft-=timeMax*0.3;
    combo=0;
    setTimeout(()=>btn.classList.remove('bad'),260);
    if(timeLeft<=0) end();
  }
}

function addPlank(){
  const b=$('#bridge');
  const p=document.createElement('div');p.className='plank new';
  b.appendChild(p);
  // 다리가 화면을 넘으면 왼쪽으로 흘려보내 계속 이어지는 느낌
  const maxPlanks=Math.floor(b.clientWidth/34);
  while(b.children.length>maxPlanks) b.removeChild(b.firstChild);
}

function moveWalker(){
  const w=$('#walker');
  const b=$('#bridge');
  const x=Math.min(b.clientWidth-40, 12+b.children.length*34-20);
  w.style.left=x+'px';
  w.textContent='🚶';
  setTimeout(()=>w.textContent='🏃',60);
}

function popCombo(txt){
  const el=$('#combo');el.textContent=txt;
  el.style.transition='none';el.style.opacity='1';el.style.transform='translateX(-50%) scale(1.3)';
  requestAnimationFrame(()=>{el.style.transition='all .6s';el.style.opacity='0';
    el.style.transform='translateX(-50%) scale(1)';});
}

function loop(t){
  if(!running)return;
  const dt=Math.min((t-last)/1000,0.05);last=t;
  timeLeft-=dt;
  const pct=Math.max(0,timeLeft/timeMax)*100;
  $('#timer').style.width=pct+'%';
  if(timeLeft<=0){end();return;}
  raf=requestAnimationFrame(loop);
}

function start(){
  steps=0;combo=0;running=true;
  $('#dist').textContent='0';
  $('#bridge').innerHTML='';$('#walker').style.left='12px';$('#walker').style.transform='scaleX(-1)';
  // 시작 발판 몇 개
  for(let i=0;i<3;i++){const p=document.createElement('div');p.className='plank';$('#bridge').appendChild(p);}
  $('#start').classList.add('hide');$('#over').classList.add('hide');
  newRound();
  last=performance.now();
  raf=requestAnimationFrame(loop);
}

function end(){
  running=false;if(raf)cancelAnimationFrame(raf);
  const w=$('#walker');w.textContent='😱';w.style.transform='scaleX(1)';
  w.style.transition='top .6s, transform .6s';
  $('#final').textContent=steps;
  $('#over-sub').textContent=steps+'걸음 전진 · 다리 길이 '+steps+'칸';
  setTimeout(()=>$('#over').classList.remove('hide'),350);
}

$('#go').onclick=start;
$('#again').onclick=start;

/* ===== 단원 선택 ===== */
function renderTopics(){
  const g=document.getElementById('tgrid');g.innerHTML='';
  MOCK_TOPICS.forEach((t,i)=>{
    const b=document.createElement('button');b.className='tbtn';
    b.innerHTML='<span>'+t.name+'</span><span class="cnt">'+t.words.length+'단어</span>';
    b.onclick=()=>{ WORDS=t.words; document.getElementById('topicsel').classList.add('hide'); start(); };
    g.appendChild(b);
  });
}
function showTopics(){
  document.getElementById('topicsel').classList.remove('hide');
  document.getElementById('start').classList.add('hide');
  var ov=document.getElementById('over'); if(ov) ov.classList.add('hide');
  renderTopics();
}
// 시작/다시 버튼을 단원 선택으로 라우팅
(function(){
  var go=document.getElementById('go');
  if(go) go.onclick=showTopics;
  var ag=document.getElementById('again');
  if(ag) ag.onclick=showTopics;
})();
// 페이지 로드 시 단원 선택 버튼 즉시 표시
renderTopics();
document.getElementById('topicsel').classList.remove('hide');

</script>
