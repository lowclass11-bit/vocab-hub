<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>모의고사 대비</title>
<style>
:root{
  --bg:#0d1117; --panel:#161d29; --panel2:#1d2634; --line:#2a3647;
  --ink:#eef2f8; --dim:#8b97ab;
  --fire:#ff7a1f; --gold:#ffcf5c; --mine:#57d9a3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1000px 500px at 50% -10%,#1a2334,var(--bg));
  color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#app{height:100dvh;display:flex;flex-direction:column;position:relative}

/* 메뉴 */
.menu{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;align-items:center;
  padding:34px 22px 60px;text-align:center;gap:22px}
.menu>.head{margin-top:auto}
.menu>.cards{margin-bottom:auto}
.eyebrow{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.28em;
  color:var(--dim);text-transform:uppercase}
h1{font-size:clamp(28px,8vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:8px}
h1 span{color:var(--gold)}
.tagline{color:var(--dim);font-size:15px;line-height:1.6;max-width:400px;margin-top:10px}

.cards{display:flex;flex-direction:column;gap:14px;width:100%;max-width:440px}
.gamecard{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;cursor:pointer;text-align:left;display:flex;gap:16px;align-items:center;
  transition:transform .14s,border-color .18s;font-family:inherit;color:var(--ink)}
.gamecard:hover{transform:translateY(-3px)}
.gamecard .ico{font-size:38px;flex-shrink:0;width:56px;height:56px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;background:var(--panel2)}
.gamecard .body{flex:1;min-width:0}
.gamecard h3{font-size:20px;font-weight:800;margin-bottom:3px}
.gamecard p{color:var(--dim);font-size:13px;line-height:1.5}
.gamecard .tag{display:inline-block;margin-top:7px;font-family:ui-monospace,monospace;
  font-size:10px;letter-spacing:.1em;padding:3px 9px;border-radius:6px;text-transform:uppercase;font-weight:700}
.c-fire{border-color:transparent}
.gamecard.c-fire:hover{border-color:var(--fire)}
.gamecard.c-fire .ico{box-shadow:inset 0 0 0 1px rgba(255,122,31,.3)}
.gamecard.c-fire .tag{background:rgba(255,122,31,.15);color:var(--fire)}
.gamecard.c-gold:hover{border-color:var(--gold)}
.gamecard.c-gold .tag{background:rgba(255,207,92,.15);color:var(--gold)}
.gamecard.c-mine:hover{border-color:var(--mine)}
.gamecard.c-mine .tag{background:rgba(87,217,163,.15);color:var(--mine)}
.gamecard.c-card:hover{border-color:#9d8bf0}
.gamecard.c-card .tag{background:rgba(157,139,240,.15);color:#9d8bf0}
.foot{color:var(--dim);font-size:12px;line-height:1.6;font-family:ui-monospace,monospace}

/* 게임 화면 (iframe) */
.player{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--bg)}
.player.on{display:flex}
.pbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0b1119;
  border-bottom:1px solid var(--line);flex-shrink:0}
.pbar button{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.pbar button:hover{border-color:var(--gold)}
.pbar .pname{font-weight:800;font-size:15px}
.pbar .pname small{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
.player iframe{flex:1;width:100%;border:none;background:var(--bg)}
</style>
</head>
<body>
<div id="app">
  <div class="menu" id="menu">
    <div class="head">
      <div class="eyebrow">Mock Exam · 모의고사 대비</div>
      <h1>모의고사 <span>단어 게임</span></h1>
      <p class="tagline">게임을 고르세요. 각 게임 안에서 단원(환경·과학·기술과 정보·심리·경제)을 선택해 플레이합니다.</p>
    </div>

    <div class="cards">
      <button class="gamecard c-fire" data-game="incinerator.html">
        <div class="ico">🔥</div>
        <div class="body">
          <h3>단어 소각장</h3>
          <p>화로에 뜬 뜻에 맞는 단어를 태워 없애는 순발력 게임.</p>
          <span class="tag">순발력 · 반응</span>
        </div>
      </button>

      <button class="gamecard c-gold" data-game="bridge.html">
        <div class="ico">🌉</div>
        <div class="body">
          <h3>단어 다리 놓기</h3>
          <p>뜻에 맞는 단어를 연속으로 밟아 낭떠러지 위 다리를 잇는 게임.</p>
          <span class="tag">연속 · 집중</span>
        </div>
      </button>

      <button class="gamecard c-mine" data-game="minefield.html">
        <div class="ico">💣</div>
        <div class="body">
          <h3>지뢰밭 건너기</h3>
          <p>15줄 격자에서 뜻에 맞는 단어만 밟아 지뢰를 피해 건너는 게임.</p>
          <span class="tag">판단 · 신중</span>
        </div>
      </button>

      <button class="gamecard c-card" data-game="cardmatch.html">
        <div class="ico">🃏</div>
        <div class="body">
          <h3>카드 짝 맞추기</h3>
          <p>카드를 뒤집어 영어와 뜻의 짝을 맞추는 기억력 게임. 6·8·10쌍 난이도.</p>
          <span class="tag">기억 · 매칭</span>
        </div>
      </button>
    </div>

    <div class="foot">단원 선택은 각 게임 안에서 · 모바일 최적화</div>
  </div>

  <!-- 게임 실행 -->
  <div class="player" id="player">
    <div class="pbar">
      <button id="back">← 게임 선택</button>
      <div class="pname" id="pname">—</div>
    </div>
    <iframe id="frame" title="게임"></iframe>
  </div>
</div>

<script>
const NAMES = {
  'incinerator.html':'🔥 단어 소각장',
  'bridge.html':'🌉 단어 다리 놓기',
  'minefield.html':'💣 지뢰밭 건너기',
  'cardmatch.html':'🃏 카드 짝 맞추기',
};
const player=document.getElementById('player');
const frame=document.getElementById('frame');
const menu=document.getElementById('menu');

document.querySelectorAll('.gamecard').forEach(c=>{
  c.onclick=()=>{
    const g=c.dataset.game;
    frame.src=g;                         // 같은 폴더의 게임 파일 로드
    document.getElementById('pname').innerHTML=NAMES[g].replace(/^(\S+)\s/,'$1 <small>모의고사</small> ');
    document.getElementById('pname').textContent=NAMES[g];
    player.classList.add('on');
  };
});
document.getElementById('back').onclick=()=>{
  player.classList.remove('on');
  frame.src='about:blank';               // 게임 정지(메모리 정리)
};
</script>
</body>
</html>
