<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>단어 짝 맞추기</title>
<style>
:root{
  --bg:#12131a; --bg2:#1b1d28; --line:#2e3244;
  --ink:#eceaf2; --dim:#8b8fa6;
  --gold:#e9b949; --teal:#43c9b0; --rose:#ec6a83; --violet:#9d8bf0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1000px 520px at 50% -8%,#232637,var(--bg));
  color:var(--ink); font-family:"Trebuchet MS",system-ui,sans-serif;
  overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
#app{height:100dvh;display:flex;flex-direction:column}

.bar{display:flex;align-items:center;gap:12px;padding:11px 16px;
  border-bottom:1px solid var(--line);background:rgba(20,22,32,.7)}
.logo{font-weight:800;letter-spacing:.02em;font-size:16px}
.logo b{color:var(--gold)}
.stats{margin-left:auto;display:flex;gap:16px;font-family:ui-monospace,Menlo,monospace;
  font-size:12px;color:var(--dim)}
.stats b{color:var(--ink);font-size:15px}

.stage{flex:1;position:relative;overflow:hidden}

.btn{cursor:pointer;border:none;border-radius:11px;padding:13px 22px;
  font-family:inherit;font-weight:800;font-size:16px;transition:filter .15s,transform .06s}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--gold);color:#12131a}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}

/* menu */
.menu{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;padding:26px;text-align:center}
.menu h1{font-size:clamp(28px,7vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.menu h1 span{color:var(--teal)}
.menu p{color:var(--dim);max-width:400px;font-size:15px;line-height:1.6}
.levels{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.lvl{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  padding:18px 22px;cursor:pointer;transition:transform .12s,border-color .18s;
  font-family:inherit;color:var(--ink);min-width:96px}
.lvl:hover{transform:translateY(-3px);border-color:var(--teal)}
.lvl .n{font-size:30px;font-weight:800;color:var(--teal)}
.lvl .l{font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.04em}

/* game */
.game{position:absolute;inset:0;display:none;flex-direction:column}
.game.on{display:flex}
.ghud{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:rgba(20,22,32,.7);flex-shrink:0}
.ghud .exit{background:transparent;border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:7px 12px;font-family:inherit;font-size:13px;cursor:pointer}
.ghud .info{margin-left:auto;display:flex;gap:14px;font-family:ui-monospace,monospace;
  font-size:12px;color:var(--dim)}
.ghud .info b{color:var(--ink);font-size:14px}

.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.board{display:grid;gap:9px;width:100%;max-width:640px;margin:0 auto}

.card{position:relative;aspect-ratio:3/4;cursor:pointer;
  perspective:600px;background:transparent;border:none;padding:0;font-family:inherit}
.card .inner{position:absolute;inset:0;transition:transform .38s cubic-bezier(.4,.15,.2,1);
  transform-style:preserve-3d}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  padding:6px;text-align:center;font-weight:800;overflow:hidden}
.face.back{background:linear-gradient(150deg,#242838,#1a1d29);
  border:1px solid var(--line);color:var(--dim);font-size:26px}
.face.back::after{content:"?";opacity:.5}
.face.front{background:var(--bg2);border:1px solid var(--line);transform:rotateY(180deg);
  color:var(--ink);line-height:1.15;word-break:keep-all}
.face.front.en{color:var(--gold)}
.face.front.ko{color:var(--teal)}
.card.matched .face.front{border-color:currentColor;
  box-shadow:0 0 0 1px currentColor inset;opacity:.55}
.card.shake .inner{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}
  25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}

/* result */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(15,16,24,.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:26px;text-align:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.overlay h2{font-size:34px;font-weight:800}
.overlay .big{font-family:ui-monospace,monospace;font-size:52px;font-weight:800;color:var(--gold);line-height:1}
.overlay .sub{color:var(--dim);font-size:14px;line-height:1.7}
.overlay .sub b{color:var(--ink)}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="logo">단어 <b>짝 맞추기</b></div>
    <div class="stats"><div>최고 <b id="best">—</b></div></div>
  </div>

  <div class="stage">
    <!-- UNIT SELECT -->
    <div class="menu" id="unitsel">
      <h1>단원 <span>선택</span></h1>
      <p>어떤 단원으로 연습할까요?</p>
      <div class="levels" id="units"></div>
    </div>

    <!-- MENU (난이도) -->
    <div class="menu" id="menu" style="display:none">
      <h1>영어와 뜻을<br><span>뒤집어</span> 맞추기</h1>
      <p id="menu-sub">카드를 두 장 뒤집어 영어 단어와 알맞은 뜻을 짝지으세요. 다 맞히면 끝.</p>
      <div class="levels" id="levels"></div>
      <button class="btn ghost" id="back-unit" style="margin-top:4px">← 단원 다시 선택</button>
    </div>

    <!-- GAME -->
    <div class="game" id="game">
      <div class="ghud">
        <button class="exit" id="exit">← 나가기</button>
        <div class="info">
          <div>짝 <b id="pairs">0/0</b></div>
          <div>횟수 <b id="moves">0</b></div>
          <div>시간 <b id="time">0:00</b></div>
        </div>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
    </div>

    <!-- RESULT -->
    <div class="overlay" id="result">
      <h2 id="r-title">완성!</h2>
      <div class="big" id="r-time">0:00</div>
      <div class="sub" id="r-sub"></div>
      <div class="row">
        <button class="btn solid" id="r-again">다시</button>
        <button class="btn ghost" id="r-menu">난이도 선택</button>
      </div>
    </div>
  </div>
</div>

    {en:"retail",ko:"소매의; 소매하다"},{en:"commerce",ko:"상업, 무역"},{en:"balance",ko:"균형; 수지"},
    {en:"customer",ko:"고객, 손님"},{en:"consumer",ko:"소비자"},{en:"wholesaler",ko:"도매상인"},
    {en:"distributor",ko:"유통업자; 분배자"},{en:"retailer",ko:"소매상인"},{en:"purchase",ko:"구입(하다)"},
    {en:"item",ko:"물품"},{en:"refund",ko:"환불(하다)"},{en:"receipt",ko:"영수증; 수령"},
    {en:"objective",ko:"목적; 객관적인"},{en:"vital",ko:"중대한; 생명의"},{en:"whether A or B",ko:"A이든 B이든"},
    {en:"shift",ko:"이동하다; 바꾸다"},{en:"favor",ko:"이익; 호의; 부탁"},{en:"realization",ko:"인식; 실현"},
    {en:"relationship",ko:"관계, 관련"},
    {en:"employment",ko:"고용"},{en:"contract",ko:"계약(하다)"},{en:"incentive",ko:"포상금; 장려하는"},
    {en:"compensation",ko:"보상"},{en:"expire",ko:"만기가 되다"},{en:"valid",ko:"유효한; 타당한"},
    {en:"business",ko:"사업; 장사"},{en:"competition",ko:"경쟁"},{en:"control",ko:"지배하다, 통제하다"},
    {en:"develop",ko:"개발하다; 발전시키다"},{en:"a price break",ko:"가격 인하"},{en:"order",ko:"주문하다; 명령하다"},
    {en:"quantity",ko:"양, 수량"},{en:"cost",ko:"비용; 비용이 들다"},{en:"store",ko:"저장하다; 가게"},
    {en:"ship",ko:"수송하다; 배"},{en:"bill",ko:"청구하다; 청구서"},{en:"company",ko:"회사; 동행"},
    {en:"possess",ko:"소유하다"},{en:"manufacture",ko:"제조(하다)"},{en:"advertise",ko:"광고하다"},
    {en:"promote",ko:"촉진하다; 승진시키다"},{en:"currently",ko:"현재는, 지금은"},{en:"ensure",ko:"보증하다"},
    {en:"exclusive",ko:"독점적인; 배타적인"},
  ]},
];
let WORDS = MOCK_TOPICS[0].words;   // 선택된 단원의 단어
let curUnit = MOCK_TOPICS[0].name;

const $=s=>document.querySelector(s);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const fmt=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');

const LEVELS=[{pairs:6,label:"쉬움"},{pairs:8,label:"보통"},{pairs:10,label:"어려움"}];
let best={};  // label -> seconds

// 단원 선택 렌더
const us=$('#units');
MOCK_TOPICS.forEach(t=>{
  const b=document.createElement('button');b.className='lvl';
  b.innerHTML=`<div class="n" style="font-size:19px">${t.name}</div><div class="l">${t.words.length}단어</div>`;
  b.onclick=()=>{
    WORDS=t.words; curUnit=t.name;
    $('#unitsel').style.display='none';
    $('#menu').style.display='flex';
    $('#menu-sub').textContent=curUnit+' · 카드를 뒤집어 영어와 뜻을 짝지으세요.';
  };
  us.appendChild(b);
});
$('#back-unit').onclick=()=>{ $('#menu').style.display='none'; $('#unitsel').style.display='flex'; };

// 난이도(레벨) 렌더
const lv=$('#levels');
LEVELS.forEach(L=>{
  const b=document.createElement('button');b.className='lvl';
  b.innerHTML=`<div class="n">${L.pairs}</div><div class="l">${L.label} · ${L.pairs}쌍</div>`;
  b.onclick=()=>start(L);
  lv.appendChild(b);
});

let timer=null, sec=0, moves=0, matched=0, totalPairs=0, first=null, lock=false, curLabel='';

function start(L){
  curLabel=L.label; totalPairs=L.pairs; matched=0; moves=0; sec=0; first=null; lock=false;
  $('#menu').style.display='none'; $('#result').classList.remove('on');
  $('#game').classList.add('on');
  $('#pairs').textContent='0/'+totalPairs;
  $('#moves').textContent='0';
  $('#time').textContent='0:00';

  // 카드 세트: 각 단어의 영어/뜻 두 장
  const picks=shuffle(WORDS).slice(0,L.pairs);
  let deck=[];
  picks.forEach((w,i)=>{
    deck.push({id:i,type:'en',text:w.en});
    deck.push({id:i,type:'ko',text:w.ko});
  });
  deck=shuffle(deck);

  // 격자 열 수: 카드 수에 맞춰
  const n=deck.length;
  const cols = n<=12 ? 4 : (n<=16 ? 4 : 5);
  const board=$('#board'); board.innerHTML='';
  board.style.gridTemplateColumns=`repeat(${cols},1fr)`;

  deck.forEach(card=>{
    const el=document.createElement('button');el.className='card';
    el.innerHTML=`<div class="inner">
      <div class="face back"></div>
      <div class="face front ${card.type}">${card.text}</div></div>`;
    el.onclick=()=>flip(el,card);
    board.appendChild(el);
  });

  clearInterval(timer);
  timer=setInterval(()=>{sec++;$('#time').textContent=fmt(sec);},1000);
}

function flip(el,card){
  if(lock||el.classList.contains('flipped')||el.classList.contains('matched'))return;
  el.classList.add('flipped');
  if(!first){first={el,card};return;}
  // second card
  moves++; $('#moves').textContent=moves;
  const a=first, b={el,card};
  first=null;
  if(a.card.id===b.card.id && a.card.type!==b.card.type){
    // match
    a.el.classList.add('matched'); b.el.classList.add('matched');
    matched++; $('#pairs').textContent=matched+'/'+totalPairs;
    if(matched===totalPairs) win();
  }else{
    lock=true;
    a.el.classList.add('shake'); b.el.classList.add('shake');
    setTimeout(()=>{
      a.el.classList.remove('flipped','shake');
      b.el.classList.remove('flipped','shake');
      lock=false;
    },700);
  }
}

function win(){
  clearInterval(timer);
  const isBest = best[curUnit+'-'+curLabel]==null || sec<best[curUnit+'-'+curLabel];
  if(isBest) best[curUnit+'-'+curLabel]=sec;
  $('#best').textContent = best[curUnit+'-'+curLabel]!=null ? fmt(best[curUnit+'-'+curLabel]) : '—';
  $('#r-title').textContent='완성! 🎉';
  $('#r-time').textContent=fmt(sec);
  $('#r-sub').innerHTML = `${curLabel} · ${totalPairs}쌍 · <b>${moves}</b>번 만에`
    + (isBest ? ' · 🏆 최고 기록!' : ` (최고 ${fmt(best[curUnit+'-'+curLabel])})`);
  $('#result').classList.add('on');
}

function goMenu(){clearInterval(timer);$('#game').classList.remove('on');
  $('#result').classList.remove('on');$('#unitsel').style.display='none';$('#menu').style.display='flex';}

$('#exit').onclick=goMenu;
$('#r-menu').onclick=goMenu;
$('#r-again').onclick=()=>start(LEVELS.find(l=>l.label===curLabel));
</script>
</body>
</html>
